<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e9ee" />
    <!-- Before anything paints: sets the light or dark theme (docs/dark-mode.md). -->
    <script src="/theme.js"></script>
    <title>Subsola: what's under the street</title>
    <meta
      name="description"
      content="What's under the street at any address, mapped in 3D from excavation permits and city utility records. For site research, dig scoping and due diligence. Research, not a utility locate: call 811 before you dig."
    />
    <!-- Share links (/?q=...) are views of this one page, not pages of their own. -->
    <link rel="canonical" href="https://subsola.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Link previews in messages and social posts. functions/index.ts rewrites the title,
      description, URL and picture for a shared street (/?q=...); these are for everything else.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Subsola" />
    <meta property="og:url" content="https://subsola.com/" />
    <meta property="og:title" content="Subsola: what's under the street" />
    <meta
      property="og:description"
      content="What's under the street at any address, mapped from public records. For site research, dig scoping and due diligence. Research, not a utility locate: call 811 before you dig."
    />
    <meta property="og:image" content="https://subsola.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A street cut open to show water, sewer, gas, electric and telecom lines below it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Subsola",
        "url": "https://subsola.com/",
        "description": "What's under the street, mapped from public records."
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      id="scene"
      class="scene"
      aria-label="3D view of the street and the utilities under it"
    ></div>
    <div id="city" class="city" aria-label="City map"></div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="Subsola home">
        <span class="mark" aria-hidden="true"></span>
        <span>Subsola</span>
      </a>
      <button
        id="city-tab"
        class="city-button"
        aria-pressed="false"
        title="Open the citywide map to find another street (5)"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M1.5 3.5 5.5 2l5 1.5 4-1.5v10.5l-4 1.5-5-1.5-4 1.5Z" />
          <path d="M5.5 2v10.5M10.5 3.5V14" />
        </svg>
        <span class="control-label">City map</span>
      </button>
      <nav class="views" aria-label="Camera">
        <button
          data-preset="above"
          aria-pressed="false"
          title="Look straight down at the street (1)"
        >
          Top down
        </button>
        <button
          data-preset="angled"
          aria-pressed="true"
          title="A tilted 3D view from above the street (2)"
        >
          3D
        </button>
      </nav>
      <form id="search" class="search panel" autocomplete="off" role="search">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" />
          <path d="m10.5 10.5 3 3" />
        </svg>
        <input
          id="search-input"
          type="search"
          maxlength="200"
          aria-label="Search an address in __CITY_NAMES_OR__"
          placeholder="Search an address"
        />
      </form>
      <button
        id="share"
        class="share-button"
        title="Copy a link to this view: the address, the camera and the open card"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.3-2.3a3 3 0 0 0-4.2-4.2l-.9.9" />
          <path d="M9.5 6.5a3 3 0 0 0-4.2 0L3 8.8A3 3 0 0 0 7.2 13l.9-.9" />
        </svg>
        <span class="control-label share-label">Copy link</span>
        <span class="control-label share-done" aria-live="polite"></span>
      </button>
      <button
        id="help"
        class="help-button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="explainer"
        aria-label="What you're looking at"
        title="What you're looking at: colors, labels and pins (?)"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5" />
          <path d="M6.2 6.2a1.9 1.9 0 0 1 3.7.6c0 1.3-1.9 1.6-1.9 2.9" />
          <circle cx="8" cy="11.6" r="0.4" />
        </svg>
      </button>
      <a
        class="help-button github-link"
        href="https://github.com/juanfiguera/subsola"
        target="_blank"
        rel="noopener"
        aria-label="Subsola's source code on GitHub"
        title="Open source: the code is on GitHub"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.23.72-.5v-1.85c-2.92.63-3.54-1.24-3.54-1.24-.48-1.21-1.17-1.54-1.17-1.54-.95-.65.07-.64.07-.64 1.06.08 1.61 1.09 1.61 1.09.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.66-1.4-2.33-.27-4.78-1.17-4.78-5.18 0-1.15.41-2.08 1.08-2.82-.1-.27-.47-1.33.1-2.78 0 0 .88-.28 2.89 1.08a10 10 0 0 1 5.25 0c2-1.36 2.88-1.08 2.88-1.08.58 1.45.21 2.51.1 2.78.68.74 1.08 1.67 1.08 2.82 0 4.02-2.45 4.9-4.79 5.16.38.33.71.97.71 1.96v2.9c0 .28.19.61.73.5A10.5 10.5 0 0 0 12 1.5Z"
          />
        </svg>
      </a>
      <div id="theme-toggle"></div>
      <a
        id="call-811"
        class="call-811"
        href="https://www.newyork-811.com/"
        target="_blank"
        rel="noopener"
        title="New York law requires a free 811 locate request at least two working days before digging"
        >Call 811<span class="control-label"> before digging</span></a
      >
    </header>

    <aside id="layers" class="layers panel" aria-label="Layers"></aside>

    <div class="toolbar panel" role="toolbar" aria-label="View controls">
      <button
        id="dig"
        class="toolbar-dig"
        title="Check which utilities may be below a location before digging (D)"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M9.5 6.5 3 13M8 3.5l4.5 4.5M10.2 1.8l4 4-2.4 2.4-4-4z" />
        </svg>
        Check a location
      </button>
      <span class="toolbar-rule" aria-hidden="true"></span>
      <!-- Phones only: the layer list folds away behind this. -->
      <button
        id="layers-toggle"
        class="layers-toggle"
        aria-controls="layers"
        aria-expanded="false"
        aria-label="Layers"
        title="Layers"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 2 14.5 5.5 8 9 1.5 5.5Z" />
          <path d="m1.5 8.5 6.5 3.5 6.5-3.5" />
          <path d="m1.5 11.5 6.5 3.5 6.5-3.5" />
        </svg>
      </button>
      <button data-rotate="-45" aria-label="Rotate left (Q)" title="Rotate left (Q)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4 6.5A5 5 0 1 1 3 9.5" />
          <path d="M4 2.5v4h4" />
        </svg>
      </button>
      <button id="compass" class="compass" aria-label="Turn north up (N)" title="Turn north up (N)">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <circle class="compass-dial" cx="14" cy="14" r="12.5" />
          <g class="compass-north">
            <path class="compass-needle" d="M14 3.5 17 14h-6z" />
            <path class="compass-tail" d="M14 24.5 11 14h6z" />
          </g>
          <g class="compass-east"><circle cx="14" cy="3.6" r="1.6" /></g>
        </svg>
      </button>
      <button data-rotate="45" aria-label="Rotate right (E)" title="Rotate right (E)">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M12 6.5A5 5 0 1 0 13 9.5" />
          <path d="M12 2.5v4H8" />
        </svg>
      </button>
      <button id="side" class="side" aria-live="polite">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path class="side-street" d="M1.5 8h13" />
          <circle class="side-eye" cx="8" cy="3.5" r="2" />
        </svg>
        <span id="side-label">Above street</span>
      </button>
      <span class="toolbar-rule" aria-hidden="true"></span>
      <button
        id="ground-photo"
        class="photo-toggle"
        role="switch"
        aria-checked="false"
        title="Show the city's aerial imagery below the utilities (4)"
      >
        <span class="switch" aria-hidden="true"></span>
        <svg class="photo-icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="2" y="3" width="12" height="10" rx="1.5" />
          <path d="m2.5 11.5 3.5-3.5 3 3 2-2 2.5 2.5" />
          <circle cx="10.5" cy="6" r="1" />
        </svg>
        <span class="control-label">Aerial photo</span>
      </button>
      <span class="toolbar-rule" aria-hidden="true"></span>
      <button
        id="stretch"
        title="Vertical exaggeration for readability at street scale. Labels show actual feet."
      >
        Depth <strong id="stretch-value">6×</strong>
      </button>
    </div>

    <!-- On a phone this is a bottom sheet with a handle; on a wide screen it's just the card. -->
    <div id="sheet" class="sheet">
      <button id="sheet-handle" class="sheet-handle" aria-label="Show more of the card">
        <span aria-hidden="true"></span>
      </button>
      <section id="card" class="card panel" aria-live="polite"></section>
    </div>

    <!-- Wide screens: About, the other pages and contact, small in the corner (src/ui/siteLinks.ts). -->
    <div id="site-links"></div>

    <!-- Phones only: a short color key over the map, which the user can put away. -->
    <aside id="phone-key" class="phone-key" aria-label="Color key" hidden></aside>

    <section
      id="explainer"
      class="explainer panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="explainer-title"
      tabindex="-1"
      hidden
    ></section>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <section id="report" class="report" aria-label="Lot report" tabindex="-1" hidden></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
