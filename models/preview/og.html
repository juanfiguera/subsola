<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow:wght@500;600&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        width: 1200px;
        height: 630px;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #e6e9ee;
        font-family: Barlow, sans-serif;
        color: #1b2230;
      }
      .art {
        position: absolute;
        right: -110px;
        bottom: -70px;
        width: 780px;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 76px;
        width: 470px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .mark {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        background: linear-gradient(
          90deg,
          #e3262b 0 20%,
          #f2c200 20% 40%,
          #f47c20 40% 60%,
          #1f6fd1 60% 80%,
          #2e9a48 80%
        );
      }
      h1 {
        margin: 0;
        font:
          800 96px/1 'Barlow Condensed',
          sans-serif;
        letter-spacing: -0.5px;
      }
      p.lede {
        margin: 30px 0 0;
        font-size: 33px;
        line-height: 1.22;
        font-weight: 500;
        color: #1b2230;
      }
      p.warn {
        position: absolute;
        left: 72px;
        bottom: 64px;
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        color: #4f5a6d;
        max-width: 400px;
        line-height: 1.3;
        padding-left: 16px;
        border-left: 5px solid #ffd60a;
      }
    </style>
  </head>
  <body>
    <img class="art" src="cutaway-trim.png" alt="" />
    <div class="copy">
      <div class="brand">
        <span class="mark"></span>
        <h1>Subsola</h1>
      </div>
      <p class="lede">What's under the street, mapped from public records.</p>
    </div>
    <p class="warn">Research, not a utility locate. Call 811 before you dig.</p>
  </body>
</html>
